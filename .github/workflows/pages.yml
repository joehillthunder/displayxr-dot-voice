name: Deploy display to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['display/**', 'assets/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r display assets _site/
          # The site root forwards to the display.
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=display/"><title>DisplayXR Dot Voice</title><a href="display/">DisplayXR Dot Voice</a>\n' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
